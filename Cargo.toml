[package]
name = "soundcloud-tui"
version = "0.1.0"
edition = "2021"

[features]
default = ["mpv-backend"]
mpv-backend = ["dep:libmpv2"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
libmpv2 = { version = "6.0.0", optional = true }
ratatui = { version = "0.30.1", default-features = false, features = ["serde", "crossterm", "layout-cache"] }
ratatui-image = { version = "11.0.4", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
dirs = "6.0.0"
chrono = "0.4"
regex = "1.11"
crokey = { version = "1.4.0", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
url = "2.5"
urlencoding = "2.1.3"
souvlaki = "0.7"
rookie = "0.5.6"
rusqlite = { version = "0.31", features = ["bundled"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
spectrum-analyzer = "1"
tempfile = "3.27.0"
tiny_http = "0.12.0"
